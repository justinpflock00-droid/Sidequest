
name: Build SIDEQUEST APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Projekt entpacken
        run: |
          mkdir extracted
          unzip -q SIDEQUEST_Android_Projekt.zip -d extracted
          WRAPPER=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "Keine gradlew-Datei gefunden"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: APK bauen
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SIDEQUEST-APK
          path: extracted/**/build/outputs/apk/debug/*.apk

